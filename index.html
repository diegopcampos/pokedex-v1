<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="pokedex">
    <h1>✨ Pokédex Virtual ✨</h1>
    <form id="pokemon-form">
      <label for="pokemonId">Digite o nome ou ID do Pokémon:</label>
      <input type="text" id="pokemonId" placeholder="Ex: pikachu ou 25" />
      <button type="submit">Pesquisar</button>
    </form>

    <div id="result" class="hidden">
      <img id="sprite" alt="Sprite do Pokémon" />
      <h2 id="poke-name"></h2>
      <p><strong>ID:</strong> <span id="poke-id"></span></p>
      <p><strong>Tipo(s):</strong> <span id="types"></span></p>
      <p><strong>Habilidades:</strong> <span id="abilities"></span></p>
      <p><strong>Altura:</strong> <span id="height"></span></p>
      <p><strong>Peso:</strong> <span id="weight"></span></p>
      <div id="stats"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
